plugins { id 'com.android.application' }

def releaseCode = providers.environmentVariable('DASHBOARD_VERSION_CODE').getOrElse('10002')
def releaseName = providers.environmentVariable('DASHBOARD_VERSION_NAME').getOrElse('0.3.2')
if (!(releaseCode ==~ /[1-9][0-9]{0,8}/) || !(releaseName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('Invalid release version configuration')
}
def signingValues = ['DASHBOARD_KEYSTORE', 'DASHBOARD_STORE_PASSWORD', 'DASHBOARD_KEY_ALIAS', 'DASHBOARD_KEY_PASSWORD']
        .collectEntries { [(it): providers.environmentVariable(it).orNull] }

android {
    namespace 'io.github.waksana.cockpitdashboard'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.waksana.cockpitdashboard'
        minSdk 23
        targetSdk 35
        versionCode releaseCode.toInteger()
        versionName releaseName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (signingValues.values().every { it }) {
                storeFile file(signingValues.DASHBOARD_KEYSTORE)
                storePassword signingValues.DASHBOARD_STORE_PASSWORD
                keyAlias signingValues.DASHBOARD_KEY_ALIAS
                keyPassword signingValues.DASHBOARD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true }
}

tasks.register('requireReleaseSigning') {
    doLast {
        if (!signingValues.values().every { it }) {
            throw new GradleException('Release signing is not configured; all DASHBOARD signing variables are required')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') dependsOn 'requireReleaseSigning'
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}

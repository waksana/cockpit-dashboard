name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cockpit-dashboard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stable-apk-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set monotonic release identity
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "DASHBOARD_VERSION_CODE=$((10000 + RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "DASHBOARD_VERSION_NAME=0.3.$RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build and verify signed release
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.DASHBOARD_KEYSTORE_BASE64 }}
          DASHBOARD_STORE_PASSWORD: ${{ secrets.DASHBOARD_STORE_PASSWORD }}
          DASHBOARD_KEY_PASSWORD: ${{ secrets.DASHBOARD_KEY_PASSWORD }}
          DASHBOARD_KEY_ALIAS: ${{ secrets.DASHBOARD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Release keystore secret is not configured"; exit 1; }
          test -n "$DASHBOARD_STORE_PASSWORD" && test -n "$DASHBOARD_KEY_PASSWORD" && test -n "$DASHBOARD_KEY_ALIAS"
          umask 077
          export DASHBOARD_KEYSTORE="$RUNNER_TEMP/dashboard-release.jks"
          trap 'rm -f "$RUNNER_TEMP/dashboard-release.jks"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$DASHBOARD_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          mkdir -p release-output
          node scripts/release-metadata.mjs app/build/outputs/apk/release/app-release.apk \
            "$ANDROID_HOME/build-tools/35.0.0/aapt" "$ANDROID_HOME/build-tools/35.0.0/apksigner" release-output
      - name: Publish immutable stable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$DASHBOARD_VERSION_NAME"
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$SOURCE_SHA" || { echo "::error::Main has advanced; refusing to publish an obsolete build"; exit 1; }
          # Never replace an existing version, including after rerunning this workflow.
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "$tag" --target "$SOURCE_SHA" --draft \
            --title "Cockpit Dashboard $DASHBOARD_VERSION_NAME" \
            --notes "Signed Android APK. Confirm installation on the device. Source: $SOURCE_SHA" \
            release-output/cockpit-dashboard.apk release-output/update.json
          gh release edit "$tag" --draft=false --latest
